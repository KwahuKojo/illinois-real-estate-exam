<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illinois Real Estate Exam Test Bank</title>
<meta name="description" content="Interactive practice test bank for the Illinois real estate broker exam: separate Illinois and National question banks, exam simulations, flashcards and math drills.">
<style>
:root{--paper:#f4f1e8;--card:#fffdf8;--ink:#17283a;--muted:#5d6b78;--line:#d9d3c3;--accent:#c8551f;--accent-ink:#fff;--navy:#17324d;--ok:#1d7a4c;--ok-bg:#e3f3ea;--bad:#b3261e;--bad-bg:#fbe9e7;--grid:rgba(23,50,77,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#10181f;--card:#18232d;--ink:#e8e4d8;--muted:#9aa7b3;--line:#2c3a47;--accent:#f0803f;--accent-ink:#17110c;--navy:#0c141b;--ok:#5fcf95;--ok-bg:#16332a;--bad:#ff8a80;--bad-bg:#3a1d1b;--grid:rgba(255,255,255,.05)}}
:root[data-theme=dark]{--paper:#10181f;--card:#18232d;--ink:#e8e4d8;--muted:#9aa7b3;--line:#2c3a47;--accent:#f0803f;--accent-ink:#17110c;--navy:#0c141b;--ok:#5fcf95;--ok-bg:#16332a;--bad:#ff8a80;--bad-bg:#3a1d1b;--grid:rgba(255,255,255,.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px}
h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;line-height:1.2;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
.top{background:var(--navy);color:#f4f1e8;border-bottom:4px solid var(--accent)}
.top .in{max-width:980px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:Georgia,serif;font-size:1.15rem;letter-spacing:.01em;background:none;border:0;color:inherit;padding:0;text-align:left}
.brand small{display:block;font:600 .68rem/1.4 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#e9a37c}
.top .sp{flex:1}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.3);color:#f4f1e8;border-radius:6px;padding:6px 12px;font-size:.85rem}
main{max-width:980px;margin:0 auto;padding:26px 20px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.lead{color:var(--muted);max-width:64ch;margin:8px 0 22px}
.banks{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:26px}
.bank{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:20px 20px 18px;width:100%}
.bank[aria-pressed=true]{border-color:var(--accent);box-shadow:5px 5px 0 var(--accent)}
.bank .tag{font:700 .68rem/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.bank h2{font-size:1.5rem;margin:6px 0 4px}
.bank p{margin:0;color:var(--muted);font-size:.9rem}
.nums{display:flex;gap:22px;margin-top:14px}
.nums b{display:block;font:700 1.35rem/1.1 Georgia,serif;font-variant-numeric:tabular-nums}
.nums span{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec{font:700 .72rem/1 system-ui;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px;display:flex;align-items:center;gap:12px}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:15px 16px;border-left:5px solid var(--navy)}
.mode:hover,.bank:hover{border-color:var(--accent)}
.mode.hot{border-left-color:var(--accent)}
.mode b{display:block;font-family:Georgia,serif;font-size:1.08rem}
.mode span{font-size:.86rem;color:var(--muted)}
.trow{display:grid;grid-template-columns:minmax(150px,1.3fr) 3fr auto;gap:14px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.trow:last-child{border:0}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)}.bar .r{background:var(--bad)}
.trow em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.84rem;white-space:nowrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:11px 20px;font-weight:650}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 16px;padding:14px 16px}
legend{font:700 .72rem/1 system-ui;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.chk{display:inline-flex;align-items:center;gap:7px;margin:5px 16px 5px 0;font-size:.93rem}
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:.86rem;color:var(--muted)}
.chip{font:700 .68rem/1 system-ui;letter-spacing:.1em;text-transform:uppercase;background:var(--navy);color:#f4f1e8;padding:5px 9px;border-radius:4px}
.timer{font:700 1.05rem/1 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:3px;margin-bottom:18px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qtext{font:1.28rem/1.4 Georgia,serif;margin:4px 0 18px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:9px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font:700 .8rem/1 system-ui;opacity:.75}
.opt.sel{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;color:inherit}
.why{border-left:4px solid var(--accent);background:var(--card);padding:12px 16px;margin:14px 0;border-radius:0 8px 8px 0}
.why b{font-family:Georgia,serif}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px}
.nav button{width:34px;height:30px;border:1px solid var(--line);background:var(--card);border-radius:4px;font-size:.78rem;font-variant-numeric:tabular-nums}
.nav .a{background:var(--navy);color:#f4f1e8;border-color:var(--navy)}
.nav .c{outline:2px solid var(--accent);outline-offset:1px}
.nav .f{border-color:var(--accent);border-width:2px}
.score{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.big{font:700 4rem/1 Georgia,serif;font-variant-numeric:tabular-nums}
.stamp{font:800 .95rem/1 system-ui;letter-spacing:.2em;text-transform:uppercase;padding:9px 14px;border:3px solid;border-radius:6px;transform:rotate(-4deg)}
.stamp.p{color:var(--ok)}.stamp.x{color:var(--bad)}
.rev{border-bottom:1px dashed var(--line);padding:14px 0}
.rev p{margin:4px 0}.rev .q{font-family:Georgia,serif;font-size:1.05rem}
.ok{color:var(--ok)}.no{color:var(--bad)}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer}
.flash .ans{font:700 1.3rem/1.35 Georgia,serif;color:var(--accent);margin:8px 0}
input[type=search]{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.foot{color:var(--muted);font-size:.8rem;margin-top:40px;max-width:76ch}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:560px){.qtext{font-size:1.12rem}.big{font-size:3rem}.trow{grid-template-columns:1fr auto}.trow .bar{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in"><button class="brand" data-go="home"><small>Illinois broker exam</small>Real Estate Test Bank</button><span class="sp"></span><button class="ghost" data-go="home">Home</button><button class="ghost" id="theme">Light / dark</button></div></header>
<main id="app"><noscript>This test bank needs JavaScript turned on.</noscript></main>
<script>
// Format: [topic, question, CORRECT answer, wrong, wrong, wrong, explanation]. Options are shuffled at runtime.
const NATIONAL = [
// ---------- Property ownership ----------
["PO","Which of the following is the most complete form of ownership in real estate?","Fee simple absolute","Life estate","Fee simple defeasible","Leasehold estate","Fee simple absolute has no conditions or time limit and is freely inheritable and transferable."],
["PO","A grandmother deeds her home to her grandson 'for as long as he lives', after which it passes to a charity. The charity holds a:","Remainder interest","Reversionary interest","Life estate pur autre vie","Leasehold interest","A future interest held by a third party named by the grantor is a remainder. If it returned to the grantor it would be a reversion."],
["PO","A life estate measured by the life of someone other than the life tenant is called:","Life estate pur autre vie","Conventional reversion","Estate at sufferance","Fee tail","Pur autre vie means 'for the life of another'."],
["PO","Which unity is required for joint tenancy but NOT for tenancy in common?","Unity of time","Unity of possession","Unity of use","Unity of occupancy","Joint tenancy needs time, title, interest and possession. Tenancy in common needs only possession."],
["PO","Three joint tenants own a parcel. One sells her interest to an outsider. The outsider becomes a:","Tenant in common with the two remaining joint tenants","Joint tenant with the other two","Tenant by the entirety","Tenant at will","A conveyance severs the joint tenancy as to that share. The other two remain joint tenants with each other."],
["PO","The distinguishing feature of joint tenancy is:","Right of survivorship","Unequal shares","The right to will one's share","Ownership limited to married couples","A deceased joint tenant's interest passes automatically to the surviving joint tenants, outside probate."],
["PO","A tenant in common dies. Her interest passes to:","Her heirs or devisees","The surviving co-owners","The state","The lender","Tenancy in common has no survivorship. The share is inheritable."],
["PO","Ownership of real property by one person alone is called ownership in:","Severalty","Common","Entirety","Trust","Severalty means the owner's interest is 'severed' from all others. It is sole ownership."],
["PO","Which of the following is real property?","A built-in dishwasher","A tenant's trade fixtures","Harvested crops","A freestanding refrigerator","Items permanently attached become fixtures and are real property. Trade fixtures and severed crops are personal property."],
["PO","Annual crops that require cultivation, such as corn, are called:","Emblements","Fixtures","Appurtenances","Fructus naturales","Emblements (fructus industriales) are treated as personal property."],
["PO","The courts' most important test for deciding whether an item is a fixture is:","The intention of the party who attached it","The cost of the item","The size of the item","How long it has been in place","The tests are method of attachment, adaptation, agreement, and intent. Intent controls."],
["PO","Shelving installed by a retail tenant for use in its business is a:","Trade fixture","Fixture owned by the landlord","Emblement","Appurtenance","Trade fixtures remain the tenant's personal property and may be removed before the lease ends."],
["PO","The right of an owner whose land borders a river to use the water is a:","Riparian right","Littoral right","Prior appropriation right","Prescriptive right","Riparian applies to rivers and streams. Littoral applies to lakes and oceans."],
["PO","Land gradually added to a riverbank by deposits of soil from the water is called:","Accretion","Avulsion","Erosion","Reliction","Accretion is gradual build-up. Avulsion is sudden loss. Reliction is land exposed when water recedes."],
["PO","An easement that benefits a neighboring parcel of land is an easement:","Appurtenant","In gross","By condemnation","In severalty","An appurtenant easement runs with the land and involves a dominant and a servient estate."],
["PO","A utility company's right to run power lines across many properties is an easement:","In gross","Appurtenant","By necessity","By prescription","An easement in gross benefits a person or company, not a parcel. There is no dominant estate."],
["PO","The parcel that is burdened by an easement is the:","Servient estate","Dominant estate","Leased fee","Remainder estate","The servient estate serves. The dominant estate benefits."],
["PO","A neighbor's garage extends two feet over the property line. This is:","An encroachment","An easement","A license","An appurtenance","An unauthorized physical intrusion onto another's land is an encroachment, usually found by survey."],
["PO","Permission to enter another's land for a specific purpose, revocable at any time, is a:","License","Easement","Lease","Profit","A license is a personal, revocable privilege and is not an interest in land."],
["PO","Which lien is a voluntary lien?","Mortgage lien","Property tax lien","Judgment lien","Mechanic's lien","The owner agrees to a mortgage. The others are imposed by law."],
["PO","Which lien generally takes priority over all other liens regardless of recording date?","Real property tax lien","First mortgage","Judgment lien","Mechanic's lien","Property tax and special assessment liens are paid first."],
["PO","A lien that attaches to all property of the debtor is a:","General lien","Specific lien","Voluntary lien","Equitable servitude","Judgments and income tax liens are general. Mortgages and property taxes are specific."],
["PO","In a condominium, the unit owner holds:","Fee title to the unit plus an undivided interest in the common elements","Shares of stock and a proprietary lease","A leasehold in the land only","A tenancy at will in the building","Cooperative owners hold stock and a proprietary lease. Condominium owners hold real property."],
["PO","The bundle of legal rights includes all of the following EXCEPT:","The right of taxation","The right of possession","The right of exclusion","The right of disposition","Taxation is a government power. The bundle is possession, control, enjoyment, exclusion, disposition."],
// ---------- Land use controls ----------
["LU","The government's power to take private property for public use on payment of just compensation is:","Eminent domain","Police power","Escheat","Taxation","The process of taking is condemnation. The power is eminent domain."],
["LU","Zoning ordinances are an exercise of:","Police power","Eminent domain","Escheat","Private deed restriction","Police power lets government regulate for health, safety and welfare with no compensation."],
["LU","Property passes to the state when an owner dies with no will and no heirs. This is:","Escheat","Eminent domain","Adverse possession","Reversion","Escheat prevents property from being ownerless."],
["LU","A use that lawfully existed before a zoning change and is allowed to continue is a:","Legal nonconforming use","Variance","Special use permit","Spot zone","Often called a grandfathered use. It usually cannot be expanded or rebuilt after destruction."],
["LU","An owner who needs to build two feet closer to the lot line than zoning allows, because of the lot's odd shape, should request a:","Variance","Nonconforming use","Rezoning","Building permit only","A variance allows a deviation because of a hardship specific to the property."],
["LU","A church allowed in a residential zone because it serves the public interest typically receives a:","Conditional (special) use permit","Variance","Nonconforming use status","Buffer zone","A conditional use is a use the ordinance allows if stated conditions are met."],
["LU","Private restrictions recorded by a developer to control lot use in a subdivision are:","Covenants, conditions and restrictions (CC&Rs)","Zoning ordinances","Building codes","Police powers","CC&Rs are private land use controls enforced by owners or the association."],
["LU","When a deed restriction and a zoning ordinance conflict, which controls?","Whichever is more restrictive","The zoning ordinance always","The deed restriction always","Whichever was recorded first","The stricter limitation must be followed."],
["LU","A strip of parkland separating a residential area from a commercial area is a:","Buffer zone","Variance","Setback","Easement in gross","Buffer zones ease the transition between incompatible uses."],
["LU","After construction is completed and inspected, the municipality issues a:","Certificate of occupancy","Building permit","Variance","Certificate of title","A certificate of occupancy confirms the building meets code and may be occupied."],
["LU","Which act regulates interstate sales of unimproved lots in large subdivisions?","Interstate Land Sales Full Disclosure Act","Truth in Lending Act","RESPA","Fair Housing Act","It requires registration and a property report for covered subdivisions sold across state lines."],
["LU","Minimum distances that a structure must be placed from the lot lines are:","Setbacks","Easements","Encroachments","Density limits","Setbacks are set by zoning or deed restriction."],
// ---------- Valuation ----------
["VA","The four elements that create value are:","Demand, utility, scarcity, transferability","Time, title, interest, possession","Cost, price, value, worth","Location, size, age, condition","Remember DUST."],
["VA","Which appraisal approach is most reliable for a single-family home in an active market?","Sales comparison approach","Cost approach","Income approach","Gross rent multiplier only","Recent sales of similar homes are the best evidence of value for houses."],
["VA","Which approach is most appropriate for a library or a new special-purpose building?","Cost approach","Sales comparison approach","Income approach","Gross income multiplier","Special-purpose properties have few comparables and no income."],
["VA","Which approach is primary for an apartment complex?","Income approach","Cost approach","Sales comparison approach","Replacement approach","Investors buy income property for its income stream."],
["VA","A comparable has a fireplace worth $3,000 and the subject does not. The appraiser will:","Subtract $3,000 from the comparable's sale price","Add $3,000 to the comparable's sale price","Add $3,000 to the subject's value","Subtract $3,000 from the subject's value","Adjust the comparable, never the subject. Comparable better: subtract. Comparable poorer: add."],
["VA","A loss in value from a poor floor plan, such as a bedroom reachable only through another bedroom, is:","Functional obsolescence","Physical deterioration","External obsolescence","Economic life","Functional obsolescence comes from design or outdated features within the property."],
["VA","A home loses value because a landfill opens nearby. This is:","External (economic) obsolescence","Functional obsolescence","Curable physical deterioration","Regression","External obsolescence arises outside the property and is always incurable by the owner."],
["VA","The principle that the worth of a lesser home rises because of better homes around it is:","Progression","Regression","Substitution","Contribution","Regression is the opposite: a fine home loses value among lesser ones."],
["VA","The principle stating that a buyer will pay no more for a property than the cost of an equally desirable alternative is:","Substitution","Anticipation","Conformity","Contribution","Substitution underlies the sales comparison approach."],
["VA","A swimming pool costs $40,000 but adds only $15,000 to market value. This shows the principle of:","Contribution","Substitution","Highest and best use","Anticipation","An improvement is worth what it adds to value, not what it costs."],
["VA","The most probable price a property should bring in a competitive, open market is its:","Market value","Market price","Cost","Assessed value","Market price is what it actually sold for. Cost is what it took to produce."],
["VA","The use that is legally permitted, physically possible, financially feasible and most productive is the:","Highest and best use","Conforming use","Nonconforming use","Plottage","All four tests must be met."],
["VA","Combining adjoining lots so the whole is worth more than the sum of the parts produces:","Plottage value","Assemblage loss","Regression","Depreciation","Assemblage is the act of combining. Plottage is the resulting increase in value."],
["VA","In the income approach, value equals:","Net operating income divided by the capitalization rate","Gross income multiplied by the capitalization rate","Net operating income multiplied by the gross rent multiplier","Cash flow minus debt service","Value = NOI / rate (the IRV formula)."],
["VA","Which is NOT deducted to reach net operating income?","Mortgage principal and interest","Property management fees","Vacancy and collection losses","Property taxes","Debt service and depreciation are not operating expenses."],
["VA","A comparative market analysis differs from an appraisal because a CMA:","Is prepared by a licensee to help set a price and is not an appraisal","Must follow USPAP","Is always ordered by the lender","Uses only the cost approach","A CMA uses sold, active and expired listings to suggest a price range."],
["VA","The final step in which an appraiser weighs the three approaches to reach one value is:","Reconciliation","Averaging","Capitalization","Substitution","Reconciliation weighs each approach by its relevance. It is not a simple average."],
// ---------- Financing ----------
["FI","The document in which a borrower promises to repay a loan is the:","Promissory note","Mortgage","Deed of trust","Deed","The note is the evidence of debt. The mortgage or deed of trust is the security instrument."],
["FI","In a mortgage, the borrower is the:","Mortgagor","Mortgagee","Trustee","Beneficiary","The mortgagor gives the mortgage. The mortgagee (lender) receives it."],
["FI","A deed of trust has three parties: trustor, beneficiary and:","Trustee","Mortgagee","Vendor","Grantee","The trustee holds title for the lender (beneficiary) until the borrower (trustor) repays."],
["FI","A clause letting the lender demand the full balance if the borrower defaults is the:","Acceleration clause","Alienation clause","Defeasance clause","Subordination clause","Acceleration makes the whole debt due, which permits foreclosure."],
["FI","A clause requiring payoff of the loan when the property is sold is the:","Alienation (due-on-sale) clause","Acceleration clause","Defeasance clause","Prepayment clause","It stops a buyer from assuming the loan without lender consent."],
["FI","The clause that requires the lender to release the lien when the loan is paid in full is the:","Defeasance clause","Alienation clause","Escalation clause","Habendum clause","Defeasance defeats the lender's interest on full payment."],
["FI","One discount point equals:","1% of the loan amount","1% of the purchase price","1% of the down payment","One-eighth of 1% of the loan amount","Points are prepaid interest calculated on the loan amount."],
["FI","A loan in which payments cover interest only, with the entire principal due at the end, is a:","Straight (term) loan","Fully amortized loan","Graduated payment loan","Reverse mortgage","A term loan ends with a balloon payment of the full principal."],
["FI","In a fully amortized fixed-rate loan, as time passes each payment includes:","More principal and less interest","More interest and less principal","Equal principal and interest","Interest only","Interest is charged on the falling balance, so more of each level payment goes to principal."],
["FI","FHA loans are:","Insured by the Federal Housing Administration","Guaranteed by the Department of Veterans Affairs","Made directly by HUD to borrowers","Free of mortgage insurance","FHA insures loans made by approved lenders and charges a mortgage insurance premium."],
["FI","VA loans are:","Guaranteed by the Department of Veterans Affairs","Insured by the FHA","Available to any first-time buyer","Limited to 80% loan-to-value","VA guarantees part of the loan and allows eligible veterans to borrow with no down payment."],
["FI","On a conventional loan, private mortgage insurance is usually required when:","The loan-to-value ratio exceeds 80%","The borrower is a veteran","The loan is FHA insured","The rate is adjustable","PMI protects the lender when the down payment is under 20%."],
["FI","Fannie Mae and Freddie Mac operate mainly in the:","Secondary mortgage market","Primary mortgage market","Federal Reserve System","Title insurance market","They buy loans from lenders, which returns money to the primary market."],
["FI","The Truth in Lending Act is implemented by:","Regulation Z","Regulation B","Regulation X","Regulation D","Regulation Z covers TILA. Regulation B covers ECOA. Regulation X covers RESPA."],
["FI","Under the Truth in Lending Act, the total yearly cost of credit must be expressed as the:","Annual percentage rate","Nominal rate","Discount rate","Index plus margin","The APR includes interest and other finance charges."],
["FI","The three-day right of rescission under the Truth in Lending Act applies to:","Refinancing a principal residence","A loan to purchase a principal residence","A loan on an investment property","Any commercial loan","Purchase-money first mortgages are exempt from rescission."],
["FI","An advertisement states 'only $1,500 per month'. Under Regulation Z this is a trigger term requiring:","Full disclosure of the credit terms, including the APR","Nothing further","Disclosure of the property's assessed value","Approval by HUD","Stating a payment, down payment, term or finance charge triggers full disclosure. Stating only the APR does not."],
["FI","RESPA prohibits:","Kickbacks and unearned fees for referring settlement services","Adjustable rate mortgages","Charging discount points","Dual agency","RESPA covers federally related loans on one-to-four family residences."],
["FI","Under the TRID rule, the Loan Estimate must be delivered within how long after loan application?","3 business days","1 business day","7 business days","10 calendar days","The lender must provide the Loan Estimate within three business days of application."],
["FI","Under the TRID rule, the borrower must receive the Closing Disclosure at least:","3 business days before consummation","1 business day before consummation","7 business days before consummation","At the closing table","This gives the borrower time to compare it with the Loan Estimate."],
["FI","The Equal Credit Opportunity Act prohibits lenders from discriminating on the basis of:","Marital status, age and receipt of public assistance, among others","Credit score","Income level","Employment history","ECOA covers race, color, religion, national origin, sex, marital status, age and public assistance income."],
["FI","A mortgage that covers more than one parcel of land is a:","Blanket mortgage","Package mortgage","Open-end mortgage","Wraparound mortgage","Developers use blanket mortgages with partial release clauses."],
["FI","A mortgage that includes both real and personal property is a:","Package mortgage","Blanket mortgage","Purchase-money mortgage","Budget mortgage","For example, a furnished condominium financed with its furniture."],
["FI","When the seller finances part of the price and takes back a note and mortgage from the buyer, it is a:","Purchase-money mortgage","Reverse mortgage","Blanket mortgage","Construction loan","Seller financing is also called a take-back mortgage."],

const money = n => { n = Math.round(n * 100) / 100; return "$" + n.toLocaleString("en-US", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h.toString(36); };

function mk(t, q, correct, wrongs, e, fmt) {

  return { t, q, o: [c, w[0], w[1], w[2]], e, gen: true };
}

  h += `</div>`;
  const hist = DB.h.filter(x => x.b === DB.bank).slice(-6).reverse();
  if (hist.length) { h += `<div class="sec">Recent exam simulations</div><div class="card">`; hist.forEach(x => h += `<div class="trow"><span>${new Date(x.d).toLocaleDateString()}</span><div class="bar"><i class="${x.p >= b.exam.pass ? "g" : "r"}" style="width:${x.p}%"></i></div><em>${x.p}% ${x.p >= b.exam.pass ? "pass" : "fail"}</em></div>`); h += `</div>`; }
  h += `<p class="foot">Real exam format: National portion 100 questions in 150 minutes, 70% to pass. Illinois portion 40 questions in 90 minutes, 75% to pass. Each portion is scored separately. Illinois content reflects the License Act amendments effective January 1, 2025 and rules through 2026. This is a study aid written for practice. It is not affiliated with PSI or IDFPR, and laws change, so confirm anything critical in your pre-license course materials and the current PSI candidate handbook. <button class="btn alt" data-go="reset" style="padding:4px 10px;font-size:.78rem;margin-left:6px">Reset my progress</button></p>`;
  app().innerHTML = h;
}

/* ---------- practice setup ---------- */
function setup() {
  const b = bank();
  let h = `<h1>Practice: ${b.name} bank</h1><p class="lead">Choose what to work on. "Smart order" puts unseen and missed questions first.</p><div class="card">
  <fieldset><legend>Topics</legend><div class="row" style="margin-bottom:6px"><button class="btn alt" data-all="1" style="padding:4px 10px;font-size:.8rem">All</button><button class="btn alt" data-all="0" style="padding:4px 10px;font-size:.8rem">None</button></div>`;
  for (const t in b.topics) h += `<label class="chk"><input type="checkbox" name="t" value="${t}" checked> ${b.topics[t]} (${b.items.filter(i => i.t === t).length})</label>`;
  h += `</fieldset><fieldset><legend>Which questions</legend>
  <label class="chk"><input type="radio" name="f" value="smart" checked> Smart order</label><label class="chk"><input type="radio" name="f" value="new"> Not yet seen</label><label class="chk"><input type="radio" name="f" value="missed"> Missed last time</label><label class="chk"><input type="radio" name="f" value="all"> Random</label></fieldset>
  <fieldset><legend>How many</legend>${[10, 25, 50, 0].map((n, i) => `<label class="chk"><input type="radio" name="n" value="${n}"${i === 1 ? " checked" : ""}> ${n || "All of them"}</label>`).join("")}</fieldset>
  <div class="row"><button class="btn" id="start">Start practice</button><button class="btn alt" data-go="home">Back</button><span id="msg" class="no"></span></div></div>`;
  app().innerHTML = h;
  $("#start").onclick = () => {
    const ts = [...document.querySelectorAll("input[name=t]:checked")].map(x => x.value);
    const f = document.querySelector("input[name=f]:checked").value, n = +document.querySelector("input[name=n]:checked").value;
    let pool = shuffle(b.items.filter(i => ts.includes(i.t)));
    if (f === "new") pool = pool.filter(i => !peek(i.id).n);
    if (f === "missed") pool = pool.filter(i => peek(i.id).l === 0);
    if (f === "smart") { const rank = i => { const s = peek(i.id); return s.l === 0 ? 0 : !s.n ? 1 : 2; }; pool.sort((x, y) => rank(x) - rank(y)); }
    if (n) pool = pool.slice(0, n);
    if (f === "smart") pool = shuffle(pool);
    if (!pool.length) { $("#msg").textContent = "No questions match that selection."; return; }
    start(pool, "practice", "Practice");
  };
}

/* ---------- session ---------- */
function start(items, mode, label, minutes) {
  stopTimer();
  S = { mode, label, i: 0, qs: items.map(it => ({ it, ord: shuffle([0, 1, 2, 3]), a: null })), end: minutes ? Date.now() + minutes * 60000 : 0, done: false };
  if (minutes) tick = setInterval(() => { const el = $("#timer"); if (!S) return stopTimer(); const left = S.end - Date.now(); if (left <= 0) return finish(); if (el) { el.textContent = clock(left); el.classList.toggle("low", left < 300000); } }, 500);
  render(); window.scrollTo(0, 0);
}
const clock = ms => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 3600) + ":" + String(Math.floor(s % 3600 / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
function topicName(it) { return BANKS.IL.topics[it.t] || BANKS.NAT.topics[it.t]; }

function render() {
  const Q = S.qs[S.i], it = Q.it, exam = S.mode === "exam", answered = Q.a !== null, show = !exam && answered;
  let h = `<div class="qhead"><span class="chip">${esc(topicName(it))}</span><span>${esc(S.label)} · Question ${S.i + 1} of ${S.qs.length}</span><span style="flex:1"></span>
  ${exam ? `<span class="timer" id="timer">${clock(S.end - Date.now())}</span>` : ""}
  ${it.gen ? "" : `<button class="btn alt" id="flag" style="padding:4px 10px;font-size:.8rem" aria-pressed="${!!peek(it.id).f}">${peek(it.id).f ? "Flagged" : "Flag"}</button>`}
  <button class="btn alt" id="quit" style="padding:4px 10px;font-size:.8rem">${exam ? "Finish exam" : "End session"}</button></div>
  <div class="prog"><i style="width:${(S.i + (answered ? 1 : 0)) / S.qs.length * 100}%"></i></div>
  <div class="card"><h2 class="qtext">${esc(it.q)}</h2><div role="group" aria-label="Answer choices">`;
  Q.ord.forEach((oi, k) => {
    let cls = "opt";
    if (show) { if (oi === 0) cls += " right"; else if (Q.a === oi) cls += " wrong"; } else if (Q.a === oi) cls += " sel";
    h += `<button class="${cls}" data-o="${oi}"${show ? " disabled" : ""}><span class="k">${"ABCD"[k]}</span><span>${esc(it.o[oi])}</span></button>`;
  });
  h += `</div>`;
  if (show) h += `<div class="why" aria-live="polite"><b class="${Q.a === 0 ? "ok" : "no"}">${Q.a === 0 ? "Correct." : "Not quite."}</b> ${Q.a === 0 ? "" : "The answer is <b>" + esc(it.o[0]) + "</b>. "}${esc(it.e)}</div>`;
  h += `<div class="row" style="margin-top:14px">`;
  if (exam) h += `<button class="btn alt" id="prev"${S.i ? "" : " disabled"}>Previous</button><button class="btn" id="next">${S.i === S.qs.length - 1 ? "Review and finish" : "Next"}</button>`;
  else h += `<button class="btn" id="next"${answered ? "" : " disabled"}>${S.i === S.qs.length - 1 ? "See results" : "Next question"}</button>`;
  h += `<span style="color:var(--muted);font-size:.8rem">Keys: A to D or 1 to 4 to answer, Enter for next</span></div>`;
  if (exam) h += `<div class="nav" aria-label="Question navigator">${S.qs.map((q, n) => `<button data-j="${n}" class="${q.a !== null ? "a" : ""}${n === S.i ? " c" : ""}${!q.it.gen && peek(q.it.id).f ? " f" : ""}" aria-label="Question ${n + 1}">${n + 1}</button>`).join("")}</div>`;
  h += `</div>`;
  app().innerHTML = h;
}
function answer(oi) {
  const Q = S.qs[S.i]; if (S.mode !== "exam" && Q.a !== null) return;
  Q.a = oi; if (S.mode !== "exam") { record(Q.it, oi === 0); save(); }
  render(); if (S.mode !== "exam") { const n = $("#next"); if (n) n.focus(); }
}
function next() { if (S.i < S.qs.length - 1) { S.i++; render(); window.scrollTo(0, 0); } else if (S.mode === "exam") { const un = S.qs.filter(q => q.a === null).length; if (!un || confirm(un + " question(s) are unanswered. Finish anyway?")) finish(); } else finish(); }
function finish() {
  stopTimer(); if (!S || S.done) return; S.done = true;
  const b = bank(), exam = S.mode === "exam";
  if (exam) { S.qs.forEach(q => record(q.it, q.a === 0)); }
  const done = S.qs.filter(q => q.a !== null), right = S.qs.filter(q => q.a === 0).length, tot = exam ? S.qs.length : done.length, p = tot ? Math.round(right / tot * 100) : 0;
  if (exam) DB.h.push({ d: Date.now(), b: DB.bank, p }); save();
  const by = {}; (exam ? S.qs : done).forEach(q => { const k = topicName(q.it); by[k] = by[k] || [0, 0]; by[k][1]++; if (q.a === 0) by[k][0]++; });
  let h = `<h1>${esc(S.label)} results</h1><div class="card" style="margin:16px 0"><div class="score"><div class="big">${p}%</div><div><b>${right} of ${tot} correct</b><br><span style="color:var(--muted)">${exam ? "Passing score for this portion is " + b.exam.pass + "%." : tot ? "Answered " + tot + " of " + S.qs.length + "." : "No questions answered."}</span></div>
  ${exam ? `<span class="stamp ${p >= b.exam.pass ? "p" : "x"}">${p >= b.exam.pass ? "Pass" : "Not yet"}</span>` : ""}</div></div><div class="card">`;
  for (const k in by) h += `<div class="trow"><span>${esc(k)}</span><div class="bar"><i class="g" style="width:${by[k][0] / by[k][1] * 100}%"></i><i class="r" style="width:${(by[k][1] - by[k][0]) / by[k][1] * 100}%"></i></div><em>${by[k][0]}/${by[k][1]}</em></div>`;
  const wrong = (exam ? S.qs : done).filter(q => q.a !== 0);
  h += `</div><div class="row" style="margin:18px 0">${wrong.length ? `<button class="btn" id="redo">Retry the ${wrong.length} I missed</button>` : ""}<button class="btn alt" data-go="home">Back to home</button></div>`;
  if (wrong.length) { h += `<div class="sec">Review what you missed</div><div class="card">`; wrong.forEach(q => h += `<div class="rev"><p class="q">${esc(q.it.q)}</p>${q.a === null ? `<p class="no">Not answered</p>` : `<p class="no">Your answer: ${esc(q.it.o[q.a])}</p>`}<p class="ok">Correct answer: ${esc(q.it.o[0])}</p><p>${esc(q.it.e)}</p></div>`); h += `</div>`; }
  app().innerHTML = h; window.scrollTo(0, 0);
  const items = wrong.map(q => q.it), r = $("#redo"); if (r) r.onclick = () => start(shuffle(items), "practice", "Retry missed");
  S = null;
}

/* ---------- other modes ---------- */
function examStart() {
  const b = bank(); let qs = [];
  for (const t in b.exam.w) {
    let pool = b.items.filter(i => i.t === t);
    if (t === "MA") pool = pool.concat(Array.from({ length: 14 }, () => pick(b.gens)()));
    if (t === "LAW" && DB.bank === "IL") pool = pool.concat(Array.from({ length: 2 }, () => pick(b.gens)()));
    qs = qs.concat(shuffle(pool).slice(0, b.exam.w[t]));
  }
  start(shuffle(qs), "exam", b.name + " exam simulation", b.exam.min);
}
function mathStart() { const b = bank(), seen = new Set(), qs = []; let guard = 0; while (qs.length < 15 && guard++ < 300) { const q = pick(b.gens)(); if (!seen.has(q.q)) { seen.add(q.q); qs.push(q); } } start(qs, "practice", DB.bank === "IL" ? "Illinois tax math" : "Math drill"); }
function flash() {
  const b = bank(); const rank = i => { const s = peek(i.id); return s.l === 0 ? 0 : !s.n ? 1 : 2; };
  const deck = shuffle(b.items).sort((x, y) => rank(x) - rank(y)).slice(0, 30); let i = 0, open = false, got = 0;
  const draw = () => {
    if (i >= deck.length) { app().innerHTML = `<h1>Deck complete</h1><p class="lead">You knew ${got} of ${deck.length}. The ones you missed will come up first next time.</p><div class="row"><button class="btn" data-go="flash">Another deck</button><button class="btn alt" data-go="home">Back to home</button></div>`; return; }
    const it = deck[i];
    app().innerHTML = `<div class="qhead"><span class="chip">${esc(b.topics[it.t])}</span><span>Flashcard ${i + 1} of ${deck.length}</span><span style="flex:1"></span><button class="btn alt" data-go="home" style="padding:4px 10px;font-size:.8rem">End</button></div><div class="prog"><i style="width:${i / deck.length * 100}%"></i></div>
    <div class="card flash" id="fc" tabindex="0" role="button" aria-label="Show answer"><h2 class="qtext">${esc(it.q)}</h2>${open ? `<p class="ans">${esc(it.o[0])}</p><p style="color:var(--muted);max-width:60ch;margin:0 auto">${esc(it.e)}</p>` : `<p style="color:var(--muted)">Say the answer to yourself, then tap or press Space.</p>`}</div>
    <div class="row" style="margin-top:14px;justify-content:center">${open ? `<button class="btn alt" id="fn">I missed it</button><button class="btn" id="fy">I knew it</button>` : `<button class="btn" id="fs">Show answer</button>`}</div>`;
    const flip = () => { if (!open) { open = true; draw(); } }; $("#fc").onclick = flip; $("#fc").onkeydown = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); } };
    if (!open) { $("#fs").onclick = flip; $("#fs").focus(); }
    else { const mark = ok => { record(it, ok); save(); if (ok) got++; i++; open = false; draw(); }; $("#fy").onclick = () => mark(true); $("#fn").onclick = () => mark(false); $("#fy").focus(); }
  };
  draw();
}
function browse() {
  const b = bank();
  app().innerHTML = `<h1>Browse: ${b.name} bank</h1><p class="lead">${b.items.length} questions. Type to search questions, answers and explanations.</p><div class="row" style="margin-bottom:14px"><input type="search" id="s" placeholder="Search, for example: escrow, radon, joint tenancy" aria-label="Search questions"><button class="btn alt" data-go="home">Back</button></div><div class="card" id="list"></div>`;
  const draw = () => { const v = $("#s").value.trim().toLowerCase(); const hits = b.items.filter(i => !v || (i.q + " " + i.o[0] + " " + i.e).toLowerCase().includes(v)); $("#list").innerHTML = hits.length ? hits.map(i => `<div class="rev"><span class="chip">${esc(b.topics[i.t])}</span><p class="q">${esc(i.q)}</p><p class="ok">${esc(i.o[0])}</p><p>${esc(i.e)}</p></div>`).join("") : "<p>No questions match.</p>"; };
  $("#s").oninput = draw; draw();
}
const ROUTES = {
  home: () => go(home), setup: () => go(setup), exam: () => go(examStart), math: () => go(mathStart), flash: () => go(flash), browse: () => go(browse),
  missed: () => { const p = bank().items.filter(i => peek(i.id).l === 0); if (p.length) go(() => start(shuffle(p), "practice", "Missed questions")); },
  flagged: () => { const p = bank().items.filter(i => peek(i.id).f); if (p.length) go(() => start(shuffle(p), "practice", "Flagged questions")); },
  reset: () => { if (confirm("Erase all saved progress for both banks?")) { DB.s = {}; DB.h = []; save(); go(home); } }
};

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.bank) { DB.bank = t.dataset.bank; save(); return go(home); }
  if (t.dataset.go) { if (S && S.mode === "exam" && !confirm("Leave the exam? Your answers will not be scored.")) return; return ROUTES[t.dataset.go](); }
  if (t.dataset.all) { document.querySelectorAll("input[name=t]").forEach(x => x.checked = t.dataset.all === "1"); return; }
  if (t.id === "theme") { const dark = DB.theme ? DB.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches; DB.theme = dark ? "light" : "dark"; save(); return applyTheme(); }
  if (!S) return;
  if (t.dataset.o !== undefined) return answer(+t.dataset.o);
  if (t.dataset.j !== undefined) { S.i = +t.dataset.j; return render(); }
  if (t.id === "next") return next();
  if (t.id === "prev") { S.i--; return render(); }
  if (t.id === "flag") { const s = st(S.qs[S.i].it.id); s.f = s.f ? 0 : 1; save(); return render(); }
  if (t.id === "quit") { if (S.mode === "exam") { const un = S.qs.filter(q => q.a === null).length; if (confirm((un ? un + " question(s) are unanswered. " : "") + "Finish and score the exam now?")) finish(); } else finish(); }
});
document.addEventListener("keydown", e => {
  if (!S || e.metaKey || e.ctrlKey || e.altKey || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase(), idx = "abcd".indexOf(k) >= 0 ? "abcd".indexOf(k) : "1234".indexOf(k);
  if (idx >= 0 && k.length === 1) { e.preventDefault(); return answer(S.qs[S.i].ord[idx]); }
  if (k === "enter" || k === "arrowright") { if (S.mode === "exam" || S.qs[S.i].a !== null) { e.preventDefault(); next(); } }
  if (k === "arrowleft" && S.mode === "exam" && S.i) { S.i--; render(); }
});
applyTheme(); home();
</script>
</body>
